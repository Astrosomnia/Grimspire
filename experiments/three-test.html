// ---------------------------------------------------------------------------
// Grimspire 2.5D test. A drowned ward built from stone blocks: a bridge, a tower

// shells the gate, Neon Choir shells fall on the tower, and anything a blast leaves

        c += vec3(.25,.3,.42) * pow(max(m,0.), 160.) * .35;

  }));

  const g = new THREE.Group();
  for (let i = 0; i < 60; i++) addSpire(g, rr(-130, 130), rr(-150, -85), rr(3, 9), rr(16, 58), .1);
  for (let i = 0; i < 22; i++) addSpire(g, -64 + i * 6 + rr(-2, 2), rr(-60, -46), rr(3, 6), rr(12, 32), .22);
  const s = new THREE.Shape(), x0 = -56, x1 = 56;
  s.moveTo(x0, -1); s.lineTo(x1, -1); s.lineTo(x1, 6.5); s.lineTo(x0, 6.5); s.lineTo(x0, -1);
  for (let x = x0 + 3.5; x < x1 - 3; x += 5) s.holes.push(archPath(x, -.8, 3.4, 5.4));
  const via = new THREE.Mesh(extrude(s, 2), farMat); via.position.set(0, 0, -32); g.add(via);
  for (let i = 0; i < 6; i++) addSpire(g, -40 + i * 15 + rr(-3, 3), -31, rr(3, 4.5), rr(14, 24), .3, .55);

// ---------------------------------------------------------------- the ward: a grid of stone blocks
const CX = .36, CY = .24, CZ = .4, GX0 = -11.5, GY0 = -1.6, GZ0 = -3.25, NX = 70, NY = 76, NZ = 13, N = NX * NY * NZ;
const ID = (i, j, k) => i + NX * (j + NY * k);

const xi = x => Math.floor((x - GX0) / CX), yj = y => Math.floor((y - GY0) / CY), zk = z => Math.floor((z - GZ0) / CZ);
const cellAt = (x, y, z) => { const i = xi(x), j = yj(y), k = zk(z); return (i < 0 || j < 0 || k < 0 || i >= NX || j >= NY || k >= NZ) ? -1 : ID(i, j, k); };
const DECK = GY0 + 16 * CY;            // 2.24, top of the bridge
const ANCHOR_J = 4;                    // rows at or below this are footed in the sump bed
const S_NONE = 0, S_STATIC = 1, S_BODY = 2, S_DEAD = 3, S_BUILD = 4;

const type = new Uint8Array(N);        // 0 empty, 1 stone, 2 glass
const state = new Uint8Array(N);

const heat = new Float32Array(N);
const glowBase = new Float32Array(N * 3);

  if (i < 0 || j < 0 || k < 0 || i >= NX || j >= NY || k >= NZ) return;

  if (g) glowBase.set([g.r, g.g, g.b], c * 3); else glowBase.fill(0, c * 3, c * 3 + 3);
};

  const hw = w / 2; if (Math.abs(x - cx) >= hw) return false; if (y < ys) return true;
  return Math.hypot(x - (cx - hw), y - ys) < w && Math.hypot(x - (cx + hw), y - ys) < w;
};
const magGlass = C.mag.clone().multiplyScalar(1.5), cyanGlass = C.cyan.clone().multiplyScalar(1.25);
const props = [];
// fill every cell whose centre is inside a box and passes a test
function fillBox(x0, x1, y0, y1, z0, z1, f = () => 1) {
  for (let k = Math.max(0, zk(z0)); k <= Math.min(NZ - 1, zk(z1)); k++) for (let j = Math.max(0, yj(y0)); j <= Math.min(NY - 1, yj(y1)); j++) for (let i = Math.max(0, xi(x0)); i <= Math.min(NX - 1, xi(x1)); i++) {
    const x = px(i), y = py(j), z = pz(k);
    if (x < x0 || x > x1 || y < y0 || y > y1 || z < z0 || z > z1) continue;

}
{

  const arches = [-5.3, -2.1, 1.1, 4.3], end = [];
  for (let j = 0; j < NY; j++) { const y = py(j); end[j] = 4.6 - (y > 1.2 ? rr(.3, 1.6) : rr(0, .6)) - (y > 1.8 ? .6 : 0); }
  fillBox(-10.4, 5, GY0, DECK, -1.25, 1.25, (x, y) => x <= end[yj(y)] && !arches.some(cx => inArch(x, y, cx, 2.2, -.4)));
  for (const x of [-3.75, -.25, 2.75]) fillBox(x - .2, x + .2, DECK, DECK + .96, -1.25, -.85);
  // tower: hollow above the deck, two floors, stepped roof, corner pinnacles, lancet windows
  const tx0 = -10.5, tx1 = -7, tz0 = -2.75, tz1 = .75, tcx = -8.75, tcz = -1;
  fillBox(tx0, tx1, GY0, 12.4, tz0, tz1, (x, y, z) => {
    const ring = x < tx0 + .45 || x > tx1 - .45 || z < tz0 + .45 || z > tz1 - .45;
    if (ring && z > tz1 - .45 && Math.abs(x - tcx) < .25 && ((y > 7 && y < 9.2) || (y > 10.1 && y < 10.9))) return magGlass;
    if (ring && x > tx1 - .45 && Math.abs(z - tcz) < .3 && y > 7.5 && y < 8.8) return magGlass;
    return y < DECK || (y > 5 && y < 5.25) || (y > 8.6 && y < 8.85) || ring;
  });

  fillBox(tx0 + 1.1, tx1 - 1.1, 14, 14.8, tz0 + 1.1, tz1 - 1.1);
  fillBox(tcx - .2, tcx + .2, 14.8, 16.2, tcz - .2, tcz + .2);
  for (const [x, z] of [[tx0, tz0], [tx1, tz0], [tx0, tz1], [tx1, tz1]]) fillBox(Math.min(x, x + (x === tx0 ? .4 : -.4)), Math.max(x, x + (x === tx0 ? .4 : -.4)), 13.2, 14.3, Math.min(z, z + (z === tz0 ? .4 : -.4)), Math.max(z, z + (z === tz0 ? .4 : -.4)));

  const tops = {};
  fillBox(5.6, 11.4, GY0, 9, -2.75, -1.75, (x, y, z) => {
    const top = tops[x] ??= 8.2 + Math.sin(x * 2.3) * .4 + rr(0, .5) - Math.max(0, x - 9.8) * 1.6;
    if (y > top || inArch(x, y, 8.5, 3, 3.5)) return 0;
    if (z > -2.05 && ((Math.abs(x - 6.25) < .2 && y > 3 && y < 5.2) || (Math.abs(x - 10.75) < .2 && y > 3.4 && y < 5.4))) return cyanGlass;

// classify, colour, build the instanced mesh
const cells = [];

const blockGeo = new THREE.BoxGeometry(1, 1, 1);

const col = new THREE.Color();

const emiAttr = new THREE.InstancedBufferAttribute(aEmi, 3); emiAttr.setUsage(THREE.DynamicDrawUsage);
blockGeo.setAttribute('aEmi', emiAttr);
blockGeo.setAttribute('aCore', new THREE.InstancedBufferAttribute(aCore, 1));
const TOWER_FRONT = pz(zk(.6)) + CZ / 2;
blockMat.onBeforeCompile = sh => {

    uCell: { value: CELL }, uGraf: { value: graffiti },

scene.add(blocks);
const instDirty = { m: false, e: false, c: false };
function writeEmi(c) {

class Particles {
  constructor(n, additive) {

    this.g = new Float32Array(n); this.drag = new Float32Array(n);

    this.col = new Float32Array(n * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.p, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('col', new THREE.BufferAttribute(this.c, 4).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('size', new THREE.BufferAttribute(this.s, 1).setUsage(THREE.DynamicDrawUsage));
    this.geo = geo;
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      uniforms: { uScale: { value: 300 }, uSoft: { value: additive ? 0 : 1 } },
      vertexShader: `attribute float size; attribute vec4 col; uniform float uScale; varying vec4 vC;
        void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_PointSize = max(size*uScale/-mv.z, size>0.?1.:0.); gl_Position = projectionMatrix*mv; vC = col; }`,
      fragmentShader: `uniform float uSoft; varying vec4 vC;
        void main(){ vec2 p = gl_PointCoord-.5; float a = vC.a;
          if(uSoft>.5){ float d = length(p); if(d>.5) discard; a *= smoothstep(.5,.25,d); }
          gl_FragColor = vec4(vC.rgb, a); }`,
    });
    this.pts = new THREE.Points(geo, this.mat); this.pts.frustumCulled = false; scene.add(this.pts);
  }
  emit(x, y, z, vx, vy, vz, life, s0, s1, c, a, grav = 0, drag = 0) {
    const i = this.i; this.i = (i + 1) % this.n;
    this.p[i * 3] = x; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z;
    this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = vz;
    this.life[i] = life; this.max[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.a0[i] = a;
    this.col[i * 3] = c.r; this.col[i * 3 + 1] = c.g; this.col[i * 3 + 2] = c.b; this.g[i] = grav; this.drag[i] = drag;
  }
  update(dt) {
    const { p, v, c, s } = this;
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { s[i] = 0; c[i * 4 + 3] = 0; continue; }
      this.life[i] -= dt;
      const k = Math.max(0, 1 - this.life[i] / this.max[i]), dr = Math.max(0, 1 - this.drag[i] * dt);
      v[i * 3] *= dr; v[i * 3 + 1] = v[i * 3 + 1] * dr - this.g[i] * dt; v[i * 3 + 2] *= dr;
      p[i * 3] += v[i * 3] * dt; p[i * 3 + 1] += v[i * 3 + 1] * dt; p[i * 3 + 2] += v[i * 3 + 2] * dt;
      if (this.g[i] > 0 && p[i * 3 + 1] < 0) { this.life[i] = 0; ripple(p[i * 3], p[i * 3 + 2], .15); }
      s[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * k;
      c[i * 4] = this.col[i * 3]; c[i * 4 + 1] = this.col[i * 3 + 1]; c[i * 4 + 2] = this.col[i * 3 + 2];
      c[i * 4 + 3] = this.a0[i] * (1 - k * k);
    }
    for (const a of ['position', 'col', 'size']) this.geo.attributes[a].needsUpdate = true;
  }

function spawnBody(list, offs, pos, q, vel, spin, chunk) {

    list.forEach((c, n) => spawnBody([c], [ZERO.clone()], offs[n].clone().applyQuaternion(q).add(pos), q.clone(),
      vel.clone().add(V.set(rnd(-.3, .3), rnd(0, .3), rnd(-.2, .2))), spin.clone(), false));

  if (world) {

      .setRotation({ x: q.x, y: q.y, z: q.z, w: q.w }).setLinvel(vel.x, vel.y, vel.z).setAngvel({ x: spin.x, y: spin.y, z: spin.z }));

    const o = b.offs[n];
    const key = `${Math.floor(o.x / (CX * 3) + rnd(0, .4))},${Math.floor(o.y / (CY * 3) + rnd(0, .4))},${Math.floor(o.z / (CZ * 2))}`;

    const pc = new THREE.Vector3(); ns.forEach(n => pc.add(b.offs[n])); pc.divideScalar(ns.length);
    const wp = pc.clone().applyQuaternion(b.q).add(b.pos);
    const out = pc.clone().applyQuaternion(b.q).normalize().multiplyScalar(rnd(.5, 2.2));
    spawnBody(ns.map(n => b.cells[n]), ns.map(n => b.offs[n].clone().sub(pc)), wp, b.q,
      lv.clone().multiplyScalar(.5).add(out).add(V.set(0, rnd(.5, 2), 0)), new THREE.Vector3(rnd(-3, 3), rnd(-3, 3), rnd(-3, 3)), false);

      const g = groundAt(m.position.x, m.position.z, m.position.y + .2);
      if (g !== null && m.position.y < g) { m.position.y = g; pr.v.multiplyScalar(.3); pr.v.y = 0; pr.w.multiplyScalar(.3); }
    } else {
      const t = pr.body.translation(), r = pr.body.rotation();
      m.quaternion.set(r.x, r.y, r.z, r.w); m.position.set(t.x, t.y, t.z).sub(V.set(0, pr.half.y, 0).applyQuaternion(m.quaternion));
    }
    if (!pr.wet && m.position.y < .1) { pr.wet = true; splash(m.position.x, m.position.z, 12); if (pr.body !== 'lite') pr.body.setLinearDamping(2.5); }
  }
}
function resetProps() {
  for (const pr of props) {
    if (pr.body && pr.body !== 'lite') world.removeRigidBody(pr.body);
    pr.body = null; pr.wet = false; pr.kick = null; pr.mesh.position.copy(pr.home); pr.mesh.quaternion.copy(pr.homeQ);
    motes(pr.home.x, pr.home.y + .3, pr.home.z, 12, null, .4);
  }
}
// pinnacle caps on the bridge
for (const x of [-3.75, -.25, 2.75]) {
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.24, .9, 4), roughMat); cone.geometry.translate(0, .45, 0);
  cone.position.set(x, DECK + .96, -1.05); cone.rotation.y = Math.PI / 4; cone.castShadow = true; scene.add(cone);
  addProp(cone, new THREE.Vector3(.17, .45, .17));
}
// the mortar
const mortar = new THREE.Group(); mortar.position.set(2.45, DECK, .2); scene.add(mortar);
const tubeG = new THREE.Group();
{
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(.42, .48, .07, 8), ironMat); plate.position.y = .035; plate.castShadow = true; mortar.add(plate);
  tubeG.position.set(0, .12, 0); tubeG.rotation.z = -.62; mortar.add(tubeG);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(.09, .11, 1.25, 10), ironMat); tube.position.y = .62; tube.castShadow = true; tubeG.add(tube);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .06, 10), armour); ring.position.y = 1.2; tubeG.add(ring);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(.115, .115, .04, 10), ventMat); band.position.y = .5; tubeG.add(band);
  for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .9, 5), ironMat);
    leg.position.set(.3, .4, sz * .22); leg.rotation.set(sz * .35, 0, .45); leg.castShadow = true; mortar.add(leg);
  }
  mortar.add(box(.5, .3, .32, armour, -.75, .15, -.1)); mortar.add(box(.44, .03, .02, ventMat, -.75, .22, .07));
}
const mortarProp = addProp(mortar, new THREE.Vector3(.5, .3, .3));

// ---------------------------------------------------------------- shells
const shells = [];
const shellGeo = new THREE.CylinderGeometry(.06, .06, .3, 6);
const muzzle = new THREE.Vector3();
function launch(from, to, T, kind) {
  const v = new THREE.Vector3((to.x - from.x) / T, (to.y - from.y + .5 * G * T * T) / T, (to.z - from.z) / T);
  const m = new THREE.Mesh(shellGeo, ironMat); m.position.copy(from); scene.add(m);
  shells.push({ m, v, kind, age: 0 });
  return v;
}
// a random standing block on the side facing the camera, inside a box
function pickTarget(x0, x1, y0, y1) {
  for (let n = 0; n < 60; n++) {
    const i = xi(rnd(x0, x1)), j = yj(rnd(y0, y1)); if (i < 0 || i >= NX || j < 0 || j >= NY) continue;
    for (let k = NZ - 1; k >= 0; k--) { const c = ID(i, j, k); if (state[c] === S_STATIC) return new THREE.Vector3(px(i), py(j), pz(k) + CZ * .5); }
  }
  return null;
}
let fireT = 1.2, choirT = 3.5, kick = 0;
function fireMortar() {
  if (mortarProp.body) return;
  tubeG.localToWorld(muzzle.set(0, 1.28, 0));
  const tgt = Math.random() < .72 ? pickTarget(5.6, 11.4, 0, 8.5) : null;
  const to = tgt || new THREE.Vector3(rnd(6.5, 15), 0, rnd(-9, -3.5));
  const v = launch(muzzle, to, rnd(1.7, 2.3), 'ash');
  kick = 1; flashL.position.copy(muzzle); flashL.intensity = 60;
  const d = v.clone().normalize();
  for (let i = 0; i < 26; i++) glowP.emit(muzzle.x, muzzle.y, muzzle.z, d.x * rnd(2, 7) + rnd(-1, 1), d.y * rnd(2, 7) + rnd(-1, 1), rnd(-1, 1), rnd(.1, .3), .09, .02, tint(C.fire, 4), 1, 2, 4);
  for (let i = 0; i < 16; i++) smokeP.emit(muzzle.x, muzzle.y, muzzle.z, d.x * rnd(.5, 2) + rnd(-.4, .4), d.y * rnd(.5, 2), rnd(-.5, .5), rnd(1.2, 2.4), .25, 1.1, GREY(.22), .5, -.15, 1.2);
  shake = Math.max(shake, .12);
}
function fireChoir() {            // incoming from off-screen right, Neon Choir cyan
  const near = Math.random() < .3;
  const tgt = near ? pickTarget(TR.x - 2.5, TR.x + 2.5, DECK - 1.5, DECK) : pickTarget(-10.5, -6.5, 0, 16);
  if (!tgt) return;
  launch(new THREE.Vector3(rnd(18, 26), rnd(14, 20), rnd(-6, -2)), tgt, rnd(2.2, 2.8), 'choir');
}
function strike(p) {               // called by a tap
  launch(p.clone().add(new THREE.Vector3(rnd(3, 6), 18, rnd(2, 5))), p, 1.1, 'strike');
}

// ---------------------------------------------------------------- rebuild: the ward knits itself back from motes
let rebuild = null, lastBuild = 0;
const totalCells = NI;
function startRebuild(t) {
  for (const b of bodies) if (!b.dead) { if (b.rb) world.removeRigidBody(b.rb); b.dead = true; motes(b.pos.x, b.pos.y, b.pos.z, Math.min(4, b.cells.length), null, .3); for (const c of b.cells) { hideCell(c); state[c] = S_DEAD; } }
  bodies.length = 0;
  const list = cells.filter(c => state[c] !== S_STATIC).sort((a, b) => cJ(a) - cJ(b));
  const j0 = list.length ? cJ(list[0]) : 0;
  rebuild = { t: 0, list: list.map(c => ({ c, at: (cJ(c) - j0) * .045 + Math.random() * .5, on: false })) };
  for (const e of rebuild.list) state[e.c] = S_BUILD;
}
function stepRebuild(dt, t) {
  rebuild.t += dt; let left = 0;
  for (const e of rebuild.list) {
    if (e.done) continue;
    const k = (rebuild.t - e.at) / .45;
    if (k < 0) { left++; continue; }
    const c = e.c;
    if (!e.on) { e.on = true; if (Math.random() < .25) glowP.emit(px(cI(c)), py(cJ(c)), pz(cK(c)) + .3, 0, rnd(.2, .6), 0, .8, .08, .02, tint(Math.random() < .7 ? C.mag : C.cyan, 3), 1, 0, 0); }
    if (k >= 1) {
      e.done = true; state[c] = S_STATIC; heat[c] = 0; setCol(c, 1); homeCell(c, 1); addStatic(c);
      glowBase.subarray(c * 3, c * 3 + 3); writeEmi(c);
    } else {
      left++; homeCell(c, .2 + .8 * k * k);
      const n = inst[c], g = (1 - k) * 2.2, mc = (cI(c) + cJ(c)) % 5 ? C.mag : C.cyan;
      aEmi[n * 3] = glowBase[c * 3] + mc.r * g; aEmi[n * 3 + 1] = glowBase[c * 3 + 1] + mc.g * g; aEmi[n * 3 + 2] = glowBase[c * 3 + 2] + mc.b * g; instDirty.e = true;
    }
  }
  if (!left) { rebuild = null; lastBuild = t; deadCount = 0; resetProps(); }
}

// ---------------------------------------------------------------- tap to strike
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (rebuild) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(blocks, false)[0];
  if (hit) { strike(hit.point.clone().add(hit.face.normal.clone().multiplyScalar(.05))); return; }
  const t = -ray.ray.origin.y / ray.ray.direction.y;
  if (t > 0) strike(ray.ray.origin.clone().addScaledVector(ray.ray.direction, t));
});

// ---------------------------------------------------------------- post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), .85, .55, .72));
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uT: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uT; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      c = mix(c, c*vec3(.92,.97,1.08) + vec3(.008,.01,.02), .6);
      vec2 q = vUv-.5; c *= 1. - dot(q,q)*.9;
      c += (h(floor(vUv*uRes) + floor(uT*12.)) - .5) * .022;
      gl_FragColor = vec4(c,1.);
    }`,
});
composer.addPass(grade);

let W = 1, H = 1, PR = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  PR = SMOOTH ? Math.min(devicePixelRatio, 2) : Math.min(devicePixelRatio, PIX_H / Math.min(W, H));
  renderer.setPixelRatio(PR); renderer.setSize(W, H, false);
  composer.setPixelRatio(PR); composer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  for (const P of [glowP, smokeP, sprayP]) P.mat.uniforms.uScale.value = H * PR / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  grade.uniforms.uRes.value.set(W * PR, H * PR);
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let t = 0, camX = -1.5, acc = 0;
const look = new THREE.Vector3();
function step(dt) {
  t += dt;
  waterUniforms.uTime.value = t; grade.uniforms.uT.value = t;
  for (const m of mists) m.material.uniforms.uT.value = t;

  const asp = W / H, dist = asp < 1 ? 17 + (1 - asp) * 16 : 17;
  if (asp < 1) camX += (TR.x * .7 + 1 - camX) * Math.min(1, dt * .8);
  else camX = -.2 + Math.sin(t * .07) * 1.3;
  camera.position.set(camX + (Math.random() - .5) * shake, 3.9 + Math.sin(t * .05) * .3 + (Math.random() - .5) * shake, dist);
  look.set(camX * .8, asp < 1 ? 4 : 3.4, 0); camera.lookAt(look);
  shake *= Math.pow(.02, dt);

  updateTrooper(dt, t);

  // firing
  if (!rebuild && !CALM) {
    fireT -= dt; if (fireT <= 0) { fireMortar(); fireT = rnd(2.4, 3.6); }
    choirT -= dt; if (choirT <= 0) { fireChoir(); choirT = rnd(3.2, 5); }
  }
  kick = Math.max(0, kick - dt * 5); tubeG.position.x = -kick * .12; tubeG.position.y = .12 - kick * .05;
  flashL.intensity *= Math.pow(.0005, dt);
  for (const l of booms) l.intensity *= Math.pow(.004, dt);
  for (let i = shells.length - 1; i >= 0; i--) {
    const S = shells[i]; S.age += dt;
    let hit = null;
    for (let s = 0; s < 3 && !hit; s++) {
      S.v.y -= G * dt / 3; S.m.position.addScaledVector(S.v, dt / 3);
      const q = S.m.position, c = cellAt(q.x, q.y, q.z);
      if ((c >= 0 && state[c] === S_STATIC) || q.y <= 0 || q.distanceTo(HEAD) < 2.3) hit = q.clone();
    }
    const q = S.m.position;
    S.m.quaternion.setFromUnitVectors(V.set(0, 1, 0), V2.copy(S.v).normalize());
    const tc = S.kind === 'choir' ? C.cyan : S.kind === 'strike' ? C.fire : C.mag;
    for (let k = 0; k < 3; k++) glowP.emit(q.x, q.y, q.z, rnd(-.3, .3), rnd(-.3, .3), rnd(-.3, .3), rnd(.25, .5), .07, .01, tint(tc, rnd(2, 4)), 1, 0, 2);
    if (Math.random() < .5) smokeP.emit(q.x, q.y, q.z, 0, .2, 0, rnd(.8, 1.5), .12, .5, GREY(.25), .3, -.1, .5);
    if (hit || S.age > 8) {
      if (hit) blast(hit, S.kind === 'strike' ? 1.6 : S.kind === 'choir' ? 1.45 : 1.25, S.kind);
      scene.remove(S.m); shells.splice(i, 1);
    }
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const B = balls[i]; B.t += dt;
    const k = B.t / .32, s = (.25 + k * .95) * B.r;
    B.m.scale.set(s, s * 1.15, s); B.m.material.opacity = Math.max(0, 1 - k) ** 2;
    if (k >= 1) { scene.remove(B.m); B.m.material.dispose(); balls.splice(i, 1); }
  }

  // physics at a fixed 60 Hz
  acc += dt; let n = 0;
  while (acc >= 1 / 60 && n < 2) { stepBodies(1 / 60); acc -= 1 / 60; n++; }
  if (n === 2) acc = 0;
  drawBodies(); updateProps(dt); coolDown(dt);
  for (const b of bodies) for (const c of b.cells) if (heat[c] > .25 && Math.random() < dt * 3) glowP.emit(b.pos.x, b.pos.y, b.pos.z, rnd(-.2, .2), rnd(.2, .6), 0, rnd(.3, .7), .05, .01, tint(C.fire, 3), 1, -.3, 1);

  // rebuild when the ward is wrecked enough, or after a long while
  if (!rebuild && (deadCount > totalCells * .16 || (t - lastBuild > 75 && deadCount > 40))) startRebuild(t);
  if (rebuild) stepRebuild(dt, t);

  for (let i = rings.length - 1; i >= 0; i--) {
    const Rg = rings[i]; Rg.t += dt; const k = Rg.t / Rg.life;
    Rg.m.scale.setScalar(.05 + k * 2.6 * Rg.size); Rg.m.material.opacity = .38 * (1 - k) * (Rg.size > .5 ? 1 : .6);
    if (k >= 1) { scene.remove(Rg.m); Rg.m.material.dispose(); rings.splice(i, 1); }
  }
  rippleBudget = Math.min(rippleBudget + dt * 30, 6);

  if (Math.random() < dt * 14) glowP.emit(rnd(-14, 14), rnd(0, 8), rnd(-8, 3), rnd(-.1, .1), rnd(.05, .3), 0, rnd(4, 8), .05, .05, tint(Math.random() < .6 ? C.mag : C.cyan, 2), .8, 0, 0);
  for (let i = 0; i < lit.length; i++) {
    const L = lit[i], m = L.material;
    if (!L.userData.base) L.userData.base = m.color.clone();
    const f = (i * 7919 % 13 === 0 && Math.sin(t * 9 + i) > .7 && Math.random() < .5) ? .15 : 1;
    m.color.copy(L.userData.base).multiplyScalar(f * (.92 + .08 * Math.sin(t * 1.3 + i)));
  }
  magLight.intensity = 34 * (.9 + .1 * Math.sin(t * 3.1)) * (Math.random() < .01 ? .3 : 1);
  chain.rotation.z = Math.sin(t * .6) * .015; chain.rotation.x = Math.sin(t * .45) * .01;
  for (let i = 0; i < RAIN; i++) {
    const o = i * 6, dy = rainV[i] * dt;
    rainPos[o + 1] -= dy; rainPos[o + 4] -= dy; rainPos[o] -= dy * .1; rainPos[o + 3] -= dy * .1;
    if (rainPos[o + 1] < 0) { if (Math.random() < .03) ripple(rainPos[o], rainPos[o + 2], .1); rainReset(i, true); }
  }
  rainGeo.attributes.position.needsUpdate = true;
  glowP.update(dt); smokeP.update(dt); sprayP.update(dt);
  if (instDirty.m) { blocks.instanceMatrix.needsUpdate = true; instDirty.m = false; }
  if (instDirty.e) { emiAttr.needsUpdate = true; instDirty.e = false; }
  if (instDirty.c) { blocks.instanceColor.needsUpdate = true; instDirty.c = false; }
}

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  step(dt);
  composer.render();
  requestAnimationFrame(frame);
}
for (let i = 0; i < 60; i++) step(1 / 60);
window.__step = step; window.__strike = p => strike(new THREE.Vector3(...p));
window.__rebuild = () => startRebuild(t);
window.__stats = () => ({ bodies: bodies.length, dead: deadCount, total: totalCells, rebuild: !!rebuild, trooper: TR.state, physics: world ? 'rapier' : 'lite' });
window.__advance = (sec) => { for (let i = 0; i < sec * 60; i++) step(1 / 60); composer.render(); };
const ld = document.getElementById('load'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
if (!Q.has('test')) requestAnimationFrame(frame); else composer.render();
</script>
