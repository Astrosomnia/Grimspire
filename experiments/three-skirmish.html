<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Grimspire Skirmish</title>
<style>
  :root{--bg:#0c1018;--ink:#8a96b0;--ink2:#c9d2e6;--mag:#ff2e88;--cyan:#3ff3ff;--panel:rgba(10,13,20,.72);--line:rgba(138,150,176,.22)}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color-scheme:dark;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  #hud{position:fixed;inset:0;pointer-events:none;font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  #teams{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:12px}
  .tb{display:grid;gap:4px;min-width:0;width:min(34vw,220px)}
  .tb.t1{text-align:right}
  .tb i{display:block;height:5px;background:var(--line)}
  .tb i b{display:block;height:100%;width:100%;transition:width .4s}
  .t0 span,.t0 b{color:var(--mag);background:none}.t0 i b{background:var(--mag)}
  .t1 span{color:var(--cyan)}.t1 i b{background:var(--cyan);margin-left:auto}
  #banner{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;display:grid;gap:3px}
  #who{font-size:12px}
  #timer{font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink2)}
  #bottom{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));gap:8px}
  .grp{display:flex;gap:6px;pointer-events:auto}
  button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink2);background:var(--panel);border:1px solid var(--line);padding:10px 12px;min-width:44px;min-height:44px;border-radius:2px;cursor:pointer;touch-action:none}
  button.on{border-color:currentColor}
  button:focus-visible{outline:1px solid var(--ink2)}
  #wpn button.on{color:var(--mag)}
  #power{position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(46vw,240px);height:6px;background:var(--line);opacity:0;transition:opacity .2s}
  #power b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mag),#ffa45a)}
  #help{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));color:var(--ink);opacity:.7;font-size:10px;white-space:nowrap}
  #tags div{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-size:10px;text-shadow:0 1px 0 #000}
  #tags .hp{display:block;color:var(--ink2)}
  #tags .act::after{content:'▾';display:block;font-size:12px;animation:bob .8s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(3px)}}
  .pop{position:absolute;transform:translate(-50%,-50%);font-size:14px;font-weight:700;animation:pop 1.3s ease-out forwards}
  @keyframes pop{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-38px}}
  #over[hidden]{display:none}
  #over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,8,12,.55);pointer-events:auto}
  #over div{display:grid;gap:14px;justify-items:center;text-align:center}
  #over h1{margin:0;font-size:20px;letter-spacing:.18em}
  #zoomg{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:6px;pointer-events:auto}
  #zoomg button{font-size:16px;padding:6px}
  #corner{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));color:var(--ink);opacity:.5;font-size:9px;text-align:right}
  #load{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink);font:600 11px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;pointer-events:none;transition:opacity .6s}
  @media (max-width:640px){#banner{top:calc(34px + env(safe-area-inset-top,0px))}.tb{width:38vw}}
  @media (pointer:coarse){#help{display:none}}
  @media (pointer:fine){.touch{display:none}}
  @media (prefers-reduced-motion:reduce){#tags .act::after{animation:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ---------------------------------------------------------------------------
// Grimspire Skirmish: a three.js 2.5D experiment. A procedural vertical ward of
// destructible stone blocks; Ash Legion (you) against Neon Choir (CPU), three troopers
// each, turn by turn. Gameplay lives on a 2D lane (x, y); the blocks behind it are
// backdrop that still breaks. Debris is Rapier rigid bodies (or a light fallback).
// ?seed=N  map   ?smooth  full resolution   ?px=240  pixel height   ?lite  no Rapier
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);

const SEED = +(Q.get('seed') || (Math.random() * 1e6 | 0));

const C = {

  g.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 0; i < 6; i++) g.fillRect(Math.random() * w | 0, Math.random() * h | 0, 2 + Math.random() * 4 | 0, 1);

  g.strokeStyle = g.fillStyle = '#ff2e88'; g.lineWidth = 10;
  g.beginPath(); g.arc(128, 92, 52, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(128, 30); g.lineTo(128, 160); g.moveTo(84, 78); g.lineTo(172, 78); g.stroke();
  g.beginPath(); g.moveTo(96, 132); g.lineTo(128, 60); g.lineTo(160, 132); g.stroke();
  g.font = '900 50px Impact, "Arial Black", sans-serif'; g.textAlign = 'center'; g.fillText('ASH', 128, 216);
  for (let i = 0; i < 18; i++) g.fillRect(64 + Math.random() * 128, 118 + Math.random() * 100, 4, 10 + Math.random() * 34);
  g.strokeStyle = g.fillStyle = '#3ff3ff'; g.lineWidth = 9;
  g.beginPath(); g.ellipse(384, 92, 66, 34, 0, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(384, 92, 16, 0, Math.PI * 2); g.fill();
  for (const r of [80, 100]) { g.beginPath(); g.arc(384, 92, r, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
  g.fillText('CHOIR', 384, 216);
  for (let i = 0; i < 18; i++) g.fillRect(320 + Math.random() * 128, 118 + Math.random() * 100, 4, 10 + Math.random() * 34);
});
sigils.wrapS = sigils.wrapT = THREE.ClampToEdgeWrapping;

// ---------------------------------------------------------------- distant city
const farMat = new THREE.MeshStandardMaterial({ color: 0x3a4152, roughness: 1, envMapIntensity: .2 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: .55, metalness: .8 });
const roughMat = new THREE.MeshStandardMaterial({ color: 0x31343c, map: grain, roughness: .95, envMapIntensity: .35 });
const glow = (c, k = 4) => new THREE.MeshBasicMaterial({ color: c.clone().multiplyScalar(k), fog: true });
function archPath(cx, y0, w, h) {
  const p = new THREE.Path(), hw = w / 2, ys = y0 + h - w * .78;
  p.moveTo(cx - hw, y0); p.lineTo(cx + hw, y0); p.lineTo(cx + hw, ys);
  p.quadraticCurveTo(cx + hw, ys + w * .5, cx, ys + w * .78); p.quadraticCurveTo(cx - hw, ys + w * .5, cx - hw, ys); p.lineTo(cx - hw, y0);

const lit = [];
function addSpire(group, x, z, w, h, litChance, bright = 1) {
  const b = h * rnd(.55, .72), s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, b + w * .7); s.lineTo(w * .36, b);
  s.lineTo(w * .3, b); s.lineTo(0, h); s.lineTo(-w * .3, b); s.lineTo(-w * .36, b); s.lineTo(-w / 2, b + w * .7); s.lineTo(-w / 2, 0);
  const wins = [], ww = w * .22, wh = Math.min(b * .3, ww * 3.6);
  for (let y = b * .35; y + wh < b - w * .2; y += wh * 1.6) if (Math.random() < .65) { s.holes.push(archPath(0, y, ww, wh)); wins.push(y); }
  const m = new THREE.Mesh(extrude(s, w * .8), farMat); m.position.set(x, -1, z); group.add(m);
  for (const y of wins) {
    if (Math.random() > litChance) continue;
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(ww, wh + ww * .7), glow(Math.random() < .5 ? C.mag : C.cyan, rnd(1, 1.8) * bright));
    pane.position.set(x, -1 + y + (wh + ww * .7) / 2 - ww * .2, z); group.add(pane); lit.push(pane);
  }
}
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: C.skyTop }, hor: { value: C.skyHor }, moon: { value: new THREE.Vector3(-.3, .36, -1).normalize() } },
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 top, hor, moon; varying vec3 vD;
      void main(){
        float y = vD.y;
        vec3 c = mix(hor, top, smoothstep(-.02, .55, y));
        float m = dot(normalize(vD), moon);
        c += vec3(.55,.6,.72) * smoothstep(.99935, .9995, m) * .5;
        c += vec3(.25,.3,.42) * pow(max(m,0.), 160.) * .35;
        c += vec3(.5,.12,.3) * pow(max(1.-abs(y-.04)*3.,0.),6.) * .12;
        gl_FragColor = vec4(c,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  }));
  sky.name = 'sky'; scene.add(sky);
  const g = new THREE.Group();
  for (let i = 0; i < 70; i++) addSpire(g, rnd(-150, 150), rnd(-160, -90), rnd(3, 9), rnd(16, 62), .1);
  for (let i = 0; i < 30; i++) addSpire(g, -90 + i * 6 + rnd(-2, 2), rnd(-64, -48), rnd(3, 6), rnd(14, 36), .2);
  const s = new THREE.Shape(), x0 = -80, x1 = 80;
  s.moveTo(x0, -1); s.lineTo(x1, -1); s.lineTo(x1, 7); s.lineTo(x0, 7); s.lineTo(x0, -1);
  for (let x = x0 + 3.5; x < x1 - 3; x += 5) s.holes.push(archPath(x, -.8, 3.4, 5.8));
  const via = new THREE.Mesh(extrude(s, 2), farMat); via.position.set(0, 0, -34); g.add(via);
  for (let i = 0; i < 9; i++) addSpire(g, -64 + i * 16 + rnd(-3, 3), -33, rnd(3, 4.5), rnd(16, 28), .3, .55);
  scene.add(g);
}

// ---------------------------------------------------------------- the ward grid
// x: lane width, y: height, z: k=0 back wall, k=1..3 the lane (what troopers stand on)
const CX = .36, CY = .24, CZ = .4, GX0 = -26, GY0 = -1.6, GZ0 = -1, NX = 145, NY = 112, NZ = 4, N = NX * NY * NZ;
const ID = (i, j, k) => i + NX * (j + NY * k);
const cI = c => c % NX, cJ = c => ((c / NX) | 0) % NY, cK = c => (c / (NX * NY)) | 0;
const px = i => GX0 + (i + .5) * CX, py = j => GY0 + (j + .5) * CY, pz = k => GZ0 + (k + .5) * CZ;
const xi = x => Math.floor((x - GX0) / CX), yj = y => Math.floor((y - GY0) / CY), zk = z => Math.floor((z - GZ0) / CZ);
const cellAt = (x, y, z) => { const i = xi(x), j = yj(y), k = zk(z); return (i < 0 || j < 0 || k < 0 || i >= NX || j >= NY || k >= NZ) ? -1 : ID(i, j, k); };
const XMIN = GX0, XMAX = GX0 + NX * CX;
const ANCHOR_J = 4;
const S_NONE = 0, S_STATIC = 1, S_BODY = 2, S_DEAD = 3;
const LANE_Z = .1;
const type = new Uint8Array(N), state = new Uint8Array(N), core = new Uint8Array(N);
const inst = new Int32Array(N).fill(-1), heat = new Float32Array(N), glowBase = new Float32Array(N * 3);
const laneSolid = (i, j) => i >= 0 && j >= 0 && i < NX && j < NY && (state[ID(i, j, 1)] === S_STATIC || state[ID(i, j, 2)] === S_STATIC || state[ID(i, j, 3)] === S_STATIC);
const laneSolidAt = (x, y) => laneSolid(xi(x), yj(y));

// ---- generator: islands in the sump, towers of rooms, bridges, ledges, ruined arches
const F = new Uint8Array(NX * NY), BK = new Uint8Array(NX * NY), GLS = new Uint8Array(NX * NY);
const I2 = (i, j) => i + NX * j;
function rect(x0, x1, y0, y1, fn) {
  for (let j = Math.max(0, yj(y0)); j <= Math.min(NY - 1, yj(y1)); j++) { const y = py(j); if (y < y0 || y >= y1) continue;
    for (let i = Math.max(0, xi(x0)); i <= Math.min(NX - 1, xi(x1)); i++) { const x = px(i); if (x >= x0 && x < x1) fn(i, j, x, y); } }
}
const solidR = (x0, x1, y0, y1) => rect(x0, x1, y0, y1, (i, j) => { F[I2(i, j)] = 1; BK[I2(i, j)] = 1; });
const carve = (x0, x1, y0, y1) => rect(x0, x1, y0, y1, (i, j) => { F[I2(i, j)] = 0; });
const inArch = (x, y, cx, w, ys) => {
  const hw = w / 2; if (Math.abs(x - cx) >= hw) return false; if (y < ys) return true;
  return Math.hypot(x - (cx - hw), y - ys) < w && Math.hypot(x - (cx + hw), y - ys) < w;
};
const FLOOR = 3.36, ROOM = 2.88, WALL = .72;
const islands = [], towers = [], decals = [];
{
  let x = -25.2;
  while (x < 23.5) {
    let w = rr(4.5, 8.5); if (x + w > 25.2) w = 25.2 - x; if (w < 2.5) break;

  }
  for (const isl of islands) {
    rect(isl.x0, isl.x1, GY0, isl.g + .6, (i, j, x, y) => {
      const edge = Math.min(x - isl.x0, isl.x1 - x), top = isl.g + Math.sin(x * 1.7) * .12 - Math.max(0, .9 - edge) * .9;
      if (y < top) { F[I2(i, j)] = 1; BK[I2(i, j)] = 1; }
    });
    const w = isl.x1 - isl.x0;
    if (w >= 3.6 && R() < .85) {
      const tw = rr(2.9, Math.min(4.6, w - .6)), tx0 = rr(isl.x0 + .3, isl.x1 - tw - .3), tx1 = tx0 + tw;
      const mid = 1 - Math.abs((tx0 + tx1) / 2) / 26;
      const n = Math.max(1, Math.min(5, Math.round(rr(1.4, 3.2) + mid * 1.8)));
      const base = isl.g, top = base + n * FLOOR;
      const T = { x0: tx0, x1: tx1, base, n, top, doors: [] };
      solidR(tx0, tx1, base - .5, top);
      for (let L = 0; L < n; L++) {
        const f = base + L * FLOOR;
        carve(tx0 + WALL, tx1 - WALL, f, f + ROOM);
        const dl = L === 0 ? R() < .8 : R() < .45, dr = L === 0 ? R() < .8 : R() < .45;
        if (dl) carve(tx0, tx0 + WALL, f, f + 2.16);
        if (dr) carve(tx1 - WALL, tx1, f, f + 2.16);
        T.doors.push([dl, dr]);
        if (L > 0 && R() < .35) { const hx = rr(tx0 + WALL, tx1 - WALL - 1.1); carve(hx, hx + 1.1, f - .48, f); }
        const wc = (tx0 + tx1) / 2, gc = wc < 0 ? 1 : 2;
        if (R() < .45) rect(wc - .18, wc + .18, f + .7, f + 2.2, (i, j) => { GLS[I2(i, j)] = gc; });
        if (tw > 3.6 && R() < .3) for (const o of [-.9, .9]) rect(wc + o - .18, wc + o + .18, f + 1, f + 2, (i, j) => { GLS[I2(i, j)] = gc; });
      }

      solidR(tx0 + .36, tx1 - .36, top, top + .48);
      solidR(tx0 + .9, tx1 - .9, top + .48, top + 1.2);
      const sc = (tx0 + tx1) / 2; solidR(sc - .18, sc + .18, top + 1.2, top + 2.4);
      solidR(tx0, tx0 + .36, top, top + 1.2); solidR(tx1 - .36, tx1, top, top + 1.2);
      // ledges
      for (let n2 = 0; n2 < 2; n2++) if (R() < .6) {
        const side = R() < .5 ? -1 : 1, y = base + rr(1.6, n * FLOOR - .6), len = rr(1.1, 2.1);
        if (side < 0) solidR(tx0 - len, tx0, y - .48, y); else solidR(tx1, tx1 + len, y - .48, y);
      }

    } else if (w >= 2.5) {

  b.addEventListener('pointerdown', e => { e.stopPropagation(); selectWeapon(n); });

});
function selectWeapon(n) { if (isHuman()) { game.weapon = n; refreshWeapons(); } }

const WATCH = Q.has('watch');

  visor.color.copy(TEAMS[game.team].col);
  ui.who.innerHTML = `<span style="color:${TEAMS[game.team].css}">${TEAMS[game.team].name}</span> · ${game.active.name}`;
  refreshWeapons();
}
function endGame(winner) {

document.getElementById('again').addEventListener('click', () => { const u = new URL(location.href); u.searchParams.set('seed', Math.random() * 1e6 | 0); location.href = u; });
function release() {

}
function updateTurn(dt) {

// ---------------------------------------------------------------- input
const keys = {};
const held = { l: false, r: false, jet: false, jump: false };
addEventListener('keydown', e => {

  keys[e.code] = true;
  if (!isHuman() || game.phase === 'over') return;

  if (e.code === 'Digit1') selectWeapon(0); if (e.code === 'Digit2') selectWeapon(1); if (e.code === 'Digit3') selectWeapon(2);

addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space' && isHuman()) chargeRelease(); });
function startCharge() {

}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -LANE_Z), hitP = new THREE.Vector3();

const pan = { x: 0, y: 0 }, ptrs = new Map();
let panLast = null;
function aimAt(e) {

function mid() { let x = 0, y = 0; const ps = [...ptrs.values()]; for (const p of ps) { x += p.x; y += p.y; } return { x: x / ps.length, y: y / ps.length, n: ps.length, d: ps.length === 2 ? Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y) : 0 }; }

  if (panLast && ptrs.size) { const m = mid(); if (m.n === panLast.n) { const k = zoom / innerHeight * .75; pan.x -= (m.x - panLast.x) * k; pan.y += (m.y - panLast.y) * k; if (m.n === 2 && panLast.d > 20 && m.d > 20) setZoom(zoom * panLast.d / m.d); } panLast = m; return; }

});
for (const ev of ['pointerup', 'pointercancel']) renderer.domElement.addEventListener(ev, e => { ptrs.delete(e.pointerId); if (!ptrs.size) panLast = null; else panLast = mid(); });

// ---------------------------------------------------------------- HUD bits

// aim guide: a dotted line from the muzzle
const guide = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(8 * 3), 3)),
  new THREE.PointsMaterial({ size: 3, sizeAttenuation: false, color: 0xffffff, transparent: true, opacity: .8 }));

  guide.visible = !!on; if (!on) return;
  guide.material.color.copy(TEAMS[A.team].col).multiplyScalar(2.5);
  const o = muzzleOf(A), d = aimDir(A), pa = guide.geometry.attributes.position;
  for (let n = 0; n < 8; n++) pa.setXYZ(n, o.x + d.x * (.4 + n * .35), o.y + d.y * (.4 + n * .35), o.z);

// ---------------------------------------------------------------- post and sizing
const composer = new EffectComposer(renderer);

function resize() {

addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let t = 0, acc = 0;
const focus = new THREE.Vector3(0, 4, 0), look = new THREE.Vector3();
function step(dt) {
  t += dt;

  let aInp = { walk: 0, jump: false, jet: false };

}
step(1 / 60);
// test hooks (headless)
